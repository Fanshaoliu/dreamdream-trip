    }

    function getTodayDay() {
      const now = new Date();
      if (now < startDate) return null;
      if (now > endDate) return 18;
      return Math.min(18, Math.max(1, daysBetween(now, startDate) + 1));
    }

          return saved ? JSON.parse(saved) : fallback;
        } catch {
          return fallback;
        }
      });
      useEffect(() => {
        try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
      }, [key, value]);
      return [value, setValue];
    }

    function mapPoint(item, index) {
      const [lat, lng] = item.coord;
      const offset = ((index % 5) - 2) * 0.035;
      const clusterOffset = Math.floor(index / 5) * 0.018;
      return [lat + offset, lng + clusterOffset];
    }

    function TripMap({ todayDay }) {
      const mapEl = useRef(null);
      const mapRef = useRef(null);
      const markersRef = useRef({});
      const [selectedDay, setSelectedDay] = useState(todayDay || 1);
      const selected = itinerary.find(item => item.day === selectedDay) || itinerary[0];

      useEffect(() => {
        if (!mapEl.current || !window.L || mapRef.current) return;

        const map = L.map(mapEl.current, {
          zoomControl: false,
          scrollWheelZoom: false,
          tap: true
        }).setView([46.7, 8.2], window.innerWidth < 768 ? 5 : 6);

        L.control.zoom({ position: "bottomright" }).addTo(map);
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
          maxZoom: 18,
          attribution: "&copy; OpenStreetMap"
        }).addTo(map);

        const routeLatLngs = itinerary.map((item, index) => mapPoint(item, index));
        L.polyline(routeLatLngs, {
          color: "#f97316",
          weight: 4,
          opacity: 0.82,
          lineCap: "round"
        }).addTo(map);

        itinerary.forEach((item, index) => {
          const themeKey = item.country.toLowerCase();
          const point = mapPoint(item, index);
          const icon = L.divIcon({
            className: "",
            html: `<div class="day-marker ${themeKey} ${item.day === todayDay ? "today" : ""}">D${item.day}</div>`,
            iconSize: [38, 38],
            iconAnchor: [19, 19],
            popupAnchor: [0, -18]
          });
          const marker = L.marker(point, { icon })
            .addTo(map)
            .bindPopup(`<b>D${item.day} ${item.title}</b><br/>${cnDate(item.date)} · ${item.summary}`);
          marker.on("click", () => setSelectedDay(item.day));
          markersRef.current[item.day] = marker;
        });

        map.fitBounds(L.latLngBounds(routeLatLngs), { padding: [22, 22] });
        mapRef.current = map;
      }, []);

      useEffect(() => {
        const marker = markersRef.current[selectedDay];
        const map = mapRef.current;
        if (!marker || !map) return;
        const latLng = marker.getLatLng();
        map.flyTo(latLng, Math.max(map.getZoom(), window.innerWidth < 768 ? 6 : 7), { duration: 0.7 });
        marker.openPopup();
      }, [selectedDay]);

      return (

              </div>

            </div>

            <div className="grid gap-4 lg:grid-cols-[1.35fr_0.85fr]">
              <div>
                <div id="trip-map" ref={mapEl} />
                <div className="mt-3 flex gap-2 overflow-x-auto pb-1 no-scrollbar">
                  {itinerary.map(item => (
                    <button
                      key={item.day}
                      onClick={() => setSelectedDay(item.day)}
                      className={classNames("min-h-11 shrink-0 rounded-2xl px-3 text-sm font-black", item.day === selectedDay ? "bg-orange-400 text-slate-950" : "bg-white/10 text-white")}
                    >
                      D{item.day}
                    </button>
                  ))}
                </div>
              </div>

              <div className={classNames("rounded-[1.5rem] border border-white/10 bg-gradient-to-br p-4", countryTheme[selected.country].bg)}>
                <div className="mb-3 flex items-start justify-between gap-3">
                  <div>
                    <p className="text-sm text-slate-300">{cnDate(selected.date)} · {selected.city}</p>
                    <h3 className="mt-1 text-2xl font-black text-white">D{selected.day} {selected.title}</h3>
                  </div>
                  <span className={classNames("rounded-full border px-2 py-1 text-xs", countryTheme[selected.country].badge)}>
                    {countryTheme[selected.country].label}

                </div>
                <p className="rounded-2xl bg-slate-950/35 p-3 text-sm leading-6 text-slate-100">{selected.summary}</p>

                  <InfoBlock title="交通" icon="🚆" items={selected.transport} />

                  <div>
                    <div className="mb-2 flex items-center gap-2 text-sm font-bold text-white"><Icon>📍</Icon>景点地图</div>
                    <div className="flex max-h-40 flex-wrap gap-2 overflow-y-auto pr-1">

    function CurrencyTool() {
      const [rates, setRates] = useLocalStorage("travel-rates", currencyDefaults);
      const [base, setBase] = useState({ currency: "CNY", amount: 100 });
      const toCny = base.currency === "CNY" ? base.amount : base.amount * rates[base.currency];
      const values = {
        CNY: toCny,
        EUR: toCny / rates.EUR,
        CHF: toCny / rates.CHF
      };
      const update = (currency, amount) => setBase({ currency, amount: Number(amount) || 0 });
      return (
        <div className="space-y-3">
          {["CNY", "EUR", "CHF"].map(cur => (
            <label key={cur} className="flex items-center gap-3 rounded-2xl bg-white/10 p-3">

              <input className="min-h-11 flex-1 rounded-xl border border-white/10 bg-slate-950/50 px-3 text-lg text-white outline-none" type="number" value={Number(values[cur]).toFixed(cur === "CNY" ? 0 : 2)} onChange={e => update(cur, e.target.value)} />
            </label>
          ))}
          <div className="grid grid-cols-2 gap-2 text-sm">

          </div>
        </div>

      const copy = async (text) => {
        try { await navigator.clipboard.writeText(text); } catch {}
      };
      return (
        <div className="space-y-3">
          {phrases.map((p, idx) => (
            <button key={idx} onClick={() => copy(`${p.zh}\nIT: ${p.it}\nFR: ${p.fr}\nDE: ${p.de}`)} className="w-full rounded-2xl bg-white/10 p-4 text-left">
              <div className="mb-2 flex items-center justify-between gap-2">
                <b className="text-white">{p.zh}</b>
                <span className="rounded-full bg-white/10 px-2 py-1 text-xs text-slate-300">{p.category}</span>
              </div>
              <p className="text-sm leading-6 text-slate-300">IT {p.it}</p>
              <p className="text-sm leading-6 text-slate-300">FR {p.fr}</p>
              <p className="text-sm leading-6 text-slate-300">DE {p.de}</p>
            </button>
          ))}
        </div>
      );
    }

    function BookingTool() {
      const [done, setDone] = useLocalStorage("travel-bookings", {});
      return (
        <div className="space-y-3">
          {bookingList.map(item => (
            <div key={item.key} className="rounded-2xl bg-white/10 p-4">
              <label className="flex items-start gap-3">
                <input type="checkbox" checked={!!done[item.key]} onChange={e => setDone({ ...done, [item.key]: e.target.checked })} className="mt-1 h-5 w-5 accent-orange-400" />
                <span className="flex-1">
                  <b className={classNames("block", done[item.key] ? "text-slate-400 line-through" : "text-white")}>{item.name}</b>
                  <span className="mt-1 block text-sm text-slate-300">{item.when} · {item.lead}</span>
                  <a href={item.url} target="_blank" rel="noreferrer" className="mt-3 inline-flex min-h-11 items-center rounded-2xl bg-orange-400 px-4 text-sm font-bold text-slate-950">打开官网</a>
                </span>
              </label>
            </div>
          ))}
        </div>
      );
    }

    function EmergencyTool() {
      return (
        <div className="grid gap-3 sm:grid-cols-2">
          {emergency.map(item => (
            <a key={item.name} href={`tel:${item.number}`} className="rounded-2xl bg-white/10 p-4">
              <p className="text-sm text-slate-300">{item.name}</p>
              <p className="mt-1 text-2xl font-black text-white">{item.number}</p>
              <p className="mt-1 text-xs text-slate-400">{item.note}</p>
            </a>
          ))}
        </div>
      );
    }

    function TipsTool() {
      return (
        <div className="grid gap-3 sm:grid-cols-2">
          {tips.map(([title, body]) => (
            <div key={title} className="rounded-2xl bg-white/10 p-4">
              <b className="text-white">{title}</b>
              <p className="mt-2 text-sm leading-6 text-slate-300">{body}</p>
            </div>
          ))}
        </div>
      );
    }

    function LinksTool() {
      return (
        <div className="space-y-4">
          {quickLinks.map(group => (
            <div key={group.group}>
              <h4 className="mb-2 font-bold text-white">{group.group}</h4>
              <div className="grid gap-2 sm:grid-cols-2">
                {group.items.map(([name, url]) => (
                  <a key={name} href={url} target="_blank" rel="noreferrer" className="min-h-11 rounded-2xl border border-white/10 bg-white/10 px-4 py-3 text-sm text-slate-100">{name}</a>
                ))}
              </div>
            </div>
          ))}
        </div>
      );
    }

    function ToolsPanel() {
      const tabs = [
        ["currency", "汇率", "💱", <CurrencyTool />],
        ["time", "时钟", "🕘", <TimeTool />],
        ["phrases", "用语", "💬", <PhraseTool />],
        ["booking", "抢票", "🎟️", <BookingTool />],
        ["emergency", "紧急", "🆘", <EmergencyTool />],
        ["tips", "常识", "🧭", <TipsTool />],
        ["links", "链接", "🔗", <LinksTool />]
      ];
      const [active, setActive] = useState("currency");
      const current = tabs.find(t => t[0] === active);
      return (
        <>
          <section id="tools" className="mx-auto max-w-6xl px-4 pt-5">
            <div className="glass rounded-[2rem] p-4">
              <div className="mb-4 flex items-end justify-between gap-3">
                <div>
                  <p className="text-sm text-cyan-200">Travel Tools</p>
                  <h2 className="text-2xl font-black text-white">出行工具箱</h2>
                </div>
                <span className="rounded-full bg-white/10 px-3 py-1 text-sm text-slate-300">{current?.[1]}</span>
              </div>
              <div className="mb-4 flex gap-2 overflow-x-auto pb-1 no-scrollbar">
                {tabs.map(([id, label, icon]) => (
                  <button key={id} onClick={() => setActive(id)} className={classNames("min-h-11 shrink-0 rounded-2xl px-4 text-sm font-bold", active === id ? "bg-orange-400 text-slate-950" : "bg-white/10 text-white")}>
                    {icon} {label}
                  </button>
                ))}
              </div>
              {current?.[3]}
            </div>
          </section>
          <nav className="fixed inset-x-0 bottom-0 z-50 border-t border-white/10 bg-slate-950/85 px-2 pt-2 backdrop-blur-xl tab-safe md:hidden">
            <div className="mx-auto grid max-w-md grid-cols-5 gap-1">
              {tabs.slice(0, 5).map(([id, label, icon]) => (
                <button key={id} onClick={() => { setActive(id); document.getElementById("tools")?.scrollIntoView({ behavior: "smooth", block: "start" }); }} className={classNames("min-h-12 rounded-2xl text-xs font-bold", active === id ? "bg-orange-400 text-slate-950" : "text-slate-200")}>
                  <span className="block text-base">{icon}</span>{label}
                </button>
              ))}
            </div>
          </nav>
        </>
      );
    }

    function Footer() {
      return (
        <footer className="mx-auto max-w-6xl px-4 pb-8 pt-8 text-center text-xs leading-6 text-slate-400">
          <p>建议出发前打开一次页面，让 CDN 资源进入浏览器缓存；同时把网页添加到手机主屏幕。</p>
          <p className="mt-1">所有行程数据来自本地 itinerary.md，链接会跳转到外部官网或 Google Maps。</p>
        </footer>
      );
    }

    function App() {
      const [dark, setDark] = useLocalStorage("travel-dark", true);
      const todayDay = getTodayDay();
      useEffect(() => {
        document.documentElement.classList.toggle("dark", dark);
        document.body.classList.toggle("light", !dark);
      }, [dark]);
      useEffect(() => {
        if (todayDay) {
          setTimeout(() => document.getElementById(`day-${todayDay}`)?.scrollIntoView({ behavior: "smooth", block: "start" }), 600);
        }
      }, []);
      return (
        <div className="bottom-safe">
          <Header todayDay={todayDay} dark={dark} setDark={setDark} />
          <Hero todayDay={todayDay} />
          <TripMap todayDay={todayDay} />
          <Timeline todayDay={todayDay} />
          <ToolsPanel />
          <Footer />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
